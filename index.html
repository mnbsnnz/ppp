<!doctype html><html lang="kk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MAGIST.PRO — Педагогика</title><style>body{margin:0;background:#f4f4f1;color:#151515;font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif}.wrap{max-width:900px;margin:auto;padding:24px 18px 80px}*{box-sizing:border-box}.top{display:flex;justify-content:space-between;padding:8px 0 28px;font-weight:900}.hero{border-top:1px solid #ddd;padding:38px 0 26px}.ey{font-size:12px;letter-spacing:.13em;color:#777;font-weight:800}h1{font-size:clamp(46px,9vw,86px);line-height:.9;letter-spacing:-.06em;margin:12px 0}.sub{color:#777;line-height:1.55}.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:26px}.mode{padding:18px;border:1px solid #ddd;border-radius:18px;background:transparent;text-align:left}.mode strong{display:block;font-size:20px}.mode span{color:#777;font-size:12px}.mode.active{background:#151515;color:white}.mode.active span{color:#ccc}.sticky{position:sticky;top:0;z-index:5;background:#f4f4f1e8;backdrop-filter:blur(12px);padding:12px 0}.meta{display:flex;justify-content:space-between;font-size:12px;font-weight:800}.track{height:5px;background:#ddd;border-radius:20px;margin-top:8px;overflow:hidden}.bar{height:100%;background:#111;width:0}.questions{display:grid;gap:14px;margin-top:16px}.card{background:#fff;border:1px solid #deded7;border-radius:22px;padding:22px}.num{font-size:11px;color:#777;letter-spacing:.13em;font-weight:800}.q{font-size:19px;line-height:1.4;font-weight:750;margin:10px 0 16px}.opts{display:grid;gap:9px}.opt{display:flex;gap:12px;text-align:left;padding:14px;border:1px solid #ddd;border-radius:14px;background:#fafaf8;font-size:15px;line-height:1.4}.ltr{min-width:26px;height:26px;border:1px solid #ccc;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:800}.opt.selected{border-color:#111}.opt.correct{background:#eef8f2;border-color:#8ac8a7}.opt.wrong{background:#fff1f0;border-color:#e4aaa6}.fb{display:none;margin-top:14px;padding:15px;background:#f3f3ef;border-radius:14px;line-height:1.55;font-size:14px}.fb.show{display:block}.fb b{display:block;margin-bottom:5px}.good b{color:#137a4a}.bad b{color:#b83932}.resultBtn{display:none;width:100%;margin-top:24px;padding:19px;border:0;border-radius:18px;background:#111;color:#fff;font-weight:850;cursor:pointer}.resultBtn.show{display:block}.resultBtn:disabled{opacity:.38;cursor:not-allowed}.result{display:none;margin-top:18px;padding:28px;background:#111;color:#fff;border-radius:26px}.result.show{display:block}.score{font-size:72px;font-weight:900;letter-spacing:-.07em}.reset{padding:12px 16px;border:1px solid #555;border-radius:12px;background:transparent;color:#fff}@media(max-width:620px){.wrap{padding:18px 12px 60px}.modes{grid-template-columns:1fr}.card{padding:18px}.q{font-size:17px}}</style></head><body><div class="wrap"><header class="top"><div>MAGIST.PRO</div><div class="ey">ТЕГІН ТЕСТ</div></header><section class="hero"><div class="ey">МАГИСТРАТУРА • ПЕДАГОГИКА</div><h1>Педагогика</h1><div class="sub">30 сұрақ. Барлық сұрақ бір бетте. КВИЗ режимінде жауап бірден тексеріледі, ТЕСТ режимінде нәтиже соңында шығады.</div><div class="modes"><button class="mode active" data-mode="quiz"><strong>КВИЗ</strong><span>Жауап пен түсіндірме бірден шығады</span></button><button class="mode" data-mode="test"><strong>ТЕСТ</strong><span>Нәтиже тек соңында көрсетіледі</span></button></div></section><div class="sticky"><div class="meta"><span id="label">КВИЗ РЕЖИМІ</span><span id="count">0 / 30</span></div><div class="track"><div class="bar" id="bar"></div></div></div><main id="questions" class="questions"></main><button id="show" class="resultBtn">НӘТИЖЕНІ КӨРУ →</button><section id="result" class="result"><div class="ey">НӘТИЖЕ</div><div id="score" class="score"></div><p id="desc"></p><button id="reset" class="reset">ҚАЙТА ТАПСЫРУ</button></section></div><script>const D=[{"n": 1, "q": "Білім беру философиясы мәртебесін анықтаудағы көзқарастар", "options": [{"key": "A", "text": "Ғылыми зерттеулер"}, {"key": "B", "text": "Педагогика саласы"}, {"key": "C", "text": "Философия саласы"}, {"key": "D", "text": "Қолданбалы философия"}, {"key": "E", "text": "Білім берудің әдіснамалық мәселелерін зерттейді"}], "answer": "D", "explanation": "Білім беру философиясы білім беру құбылыстарын философиялық ұғымдар мен қағидалар арқылы талдайтын қолданбалы бағыт ретінде қарастырылады. Ол білім берудің мақсаты, құндылығы және адам мен қоғам дамуындағы орнын түсіндіруге мүмкіндік береді."}, {"n": 2, "q": "Білім беру жүйесі тұлға қажеттіліктері мен мүмкіндіктерін еске ала отырып бөлінеді", "options": [{"key": "A", "text": "формалды, формалды емес, информалды"}, {"key": "B", "text": "орта, жоғары"}, {"key": "C", "text": "күндізгі, сырттай, қашықтық"}, {"key": "D", "text": "жалпы, жоғары"}, {"key": "E", "text": "толық, қысқартылған"}], "answer": "A", "explanation": "Тұлғаның қажеттіліктері мен мүмкіндіктеріне сай білім алу формалды, формалды емес және информалды түрде жүзеге асады. Формалды білім ресми бағдарламалармен, формалды емес білім ұйымдастырылған қосымша оқумен, ал информалды білім күнделікті өмірдегі өздігінен үйренумен байланысты."}, {"n": 3, "q": "«Пайдагогос» деген сөздін түсініктемесі", "options": [{"key": "A", "text": "өмір сүру"}, {"key": "B", "text": "баланы ізгілендеру"}, {"key": "C", "text": "баланы өсіру"}, {"key": "D", "text": "бала тəрбиесін бағыттау өнері"}, {"key": "E", "text": "баланы түзету"}], "answer": "D", "explanation": "«Пайдагогос» ұғымының тарихи негізі баланы жетелеу, оның тәрбиесіне бағыт беру мағынасымен байланысты. Кейін бұл ұғым тәрбиелеу мен білім берудің теориясы және практикасын білдіретін педагогика терминінің қалыптасуына негіз болды."}, {"n": 4, "q": "Mектеп туралы алғашқы мәліметтер ... тіліндегі әдебиеттерде кездеседі", "options": [{"key": "A", "text": "неміс"}, {"key": "B", "text": "араб"}, {"key": "C", "text": "египет"}, {"key": "D", "text": "грек"}, {"key": "E", "text": "ағылшын"}], "answer": "C", "explanation": "Ежелгі Египетте жазу, есеп, басқару және діни білімдерді үйрететін арнайы оқу орындары болған. Сондықтан мектеп туралы ең ерте тарихи мәліметтердің бір бөлігі ежелгі египеттік жазба деректерден кездеседі."}, {"n": 5, "q": "Ұстаз тұлғасының педагогикалық бағыттылығын анықтайды", "options": [{"key": "A", "text": "ұстаздың педагогикалық тәжірибесі"}, {"key": "B", "text": "оқушы қажеттіліктерін қанағаттандыруға бейімделуі"}, {"key": "C", "text": "педагогтың кәсіби жетілуге деген қабілеттіліктері"}, {"key": "D", "text": "педагогикалық әдіс-тәсілдерді жетік және ұтымды пайдалану"}, {"key": "E", "text": "педагогтың өзін-өзі іске асыру қажеттіліктері"}], "answer": "B", "explanation": "Педагогикалық бағыттылық мұғалім қызметінің тұлғаға бағдарлануын білдіреді. Оқушының қажеттіліктерін түсіну және оларды қанағаттандыруға бағытталу мұғалімнің кәсіби әрекетінің гуманистік мазмұнын айқындайды."}, {"n": 6, "q": "Педагогикалық қабілеттілік", "options": [{"key": "A", "text": "педагогтің жеке ізденісінің нәтижесі"}, {"key": "B", "text": "педагогикалық білімнің нәтижесі"}, {"key": "C", "text": "педагогикалық білім мен тәжірибенің шығармашылыққа қатысты көрінісі"}, {"key": "D", "text": "педагогикалық іс-әрекетті орындауда жоғары деңгейде көрінетін жеке қасиеттері"}, {"key": "E", "text": "жалпылама жиынтық қасиеттер"}], "answer": "D", "explanation": "Педагогикалық қабілеттілік – педагогикалық іс-әрекетті нәтижелі орындауға мүмкіндік беретін тұлғаның жеке-психологиялық қасиеттерінің жүйесі. Ол білім мен тәжірибені кәсіби жағдайда тиімді қолдану мүмкіндігін де қамтиды."}, {"n": 7, "q": "Басқару стилі бойынша бөлінеді", "options": [{"key": "A", "text": "адамгершілік"}, {"key": "B", "text": "отбасылық"}, {"key": "C", "text": "діни"}, {"key": "D", "text": "авторитарлық"}, {"key": "E", "text": "қоғамдық"}], "answer": "D", "explanation": "Авторитарлық стиль – басқару стильдерінің классикалық түрлерінің бірі. Мұнда негізгі шешімдерді басшы немесе педагог қабылдап, талап қою мен бақылау басым болады."}, {"n": 8, "q": "Mұғалімдерді аттестациялаудың принциптері", "options": [{"key": "A", "text": "Қабілеттілік"}, {"key": "B", "text": "Бірізділік"}, {"key": "C", "text": "Сауаттылық"}, {"key": "D", "text": "Адамгершілік"}, {"key": "E", "text": "Жариялылық"}], "answer": "E", "explanation": "Аттестация үдерісіндегі жариялылық бағалау талаптары мен нәтижелерінің ашықтығын қамтамасыз етеді. Бұл принцип рәсімнің түсінікті, айқын және қатысушылар үшін қолжетімді болуына бағытталған."}, {"n": 9, "q": "Педагогика ғылымымен тығыз байланысты", "options": [{"key": "A", "text": "Гигиена"}, {"key": "B", "text": "Биология"}, {"key": "C", "text": "Астрономия"}, {"key": "D", "text": "Психология"}, {"key": "E", "text": "Физиология"}], "answer": "D", "explanation": "Педагогика мен психология адамның дамуы, мінез-құлқы, танымы және тұлғалық қалыптасуы мәселелерінде өзара тығыз байланысады. Психологиялық заңдылықтарды білу оқыту мен тәрбиені ғылыми негізде ұйымдастыруға көмектеседі."}, {"n": 10, "q": "Eуропалық тəрбие жүйесінің бесігі", "options": [{"key": "A", "text": "Ежелгі Грекия"}, {"key": "B", "text": "Германия"}, {"key": "C", "text": "Ұлыбритания"}, {"key": "D", "text": "Швеция"}, {"key": "E", "text": "Македония"}], "answer": "A", "explanation": "Ежелгі Грекия Еуропадағы тәрбие мен білім беру идеяларының тарихи бастауларының бірі саналады. Афина және Спарта тәрбие жүйелері кейінгі еуропалық педагогикалық ойдың дамуына елеулі ықпал етті."}, {"n": 11, "q": "Педагогикалық үдерістің кейбір тараптарын тереңдей тануға, алуан қырлы педагогикалық қызметтің заңдылықтарын ашуға бағдарланған істер", "options": [{"key": "A", "text": "Болжам жоба"}, {"key": "B", "text": "Тәжірибені ұйымдастыру"}, {"key": "C", "text": "Іргелі зерттеулер"}, {"key": "D", "text": "Зерттеу әдістемесі"}, {"key": "E", "text": "Қолданбалы зерттеулер"}], "answer": "E", "explanation": "Қолданбалы зерттеулер педагогикалық теорияны нақты практикалық міндеттерді шешуге бағыттайды. Олар педагогикалық қызметтің жекелеген қырларын терең зерттеп, тәжірибеде қолданылатын заңдылықтар мен тәсілдерді айқындайды."}, {"n": 12, "q": "Педагогиканың теориялық міндеттерінің деңгейлері", "options": [{"key": "A", "text": "түсіндіру, анықтау, болжау"}, {"key": "B", "text": "реттеу, жаңалау, түсіндіру"}, {"key": "C", "text": "жаңалау, түзету"}, {"key": "D", "text": "түсіндіру, анықтау, ынталандыру"}, {"key": "E", "text": "жоспарлау, ашу, болжау"}], "answer": "A", "explanation": "Педагогиканың теориялық қызметі педагогикалық құбылыстарды түсіндіруді, заңдылықтарын анықтауды және олардың болашақтағы дамуын болжауды қамтиды."}, {"n": 13, "q": "Aдамның сандық жəне сапалық өзгерістерінің үдерісі мен нəтижесі", "options": [{"key": "A", "text": "Өсу"}, {"key": "B", "text": "Бейімдеу"}, {"key": "C", "text": "Даму"}, {"key": "D", "text": "Әлеуметтену"}, {"key": "E", "text": "Қалыптасу"}], "answer": "C", "explanation": "Даму – адамның сандық және сапалық өзгерістерінің біртұтас үдерісі мен нәтижесі. Ол ағзадағы, психикадағы, ойлаудағы және тұлғалық қасиеттердегі өзгерістерді қамтиды."}, {"n": 14, "q": "Aдам ағзасының физиологиялық жəне психикалық қасиеттері", "options": [{"key": "A", "text": "Ортаның әсері"}, {"key": "B", "text": "Ішкі уәж"}, {"key": "C", "text": "Ішкі қайшылықтар"}, {"key": "D", "text": "Сыртқы қайшылықтар"}, {"key": "E", "text": "Тәрбие тетіктері"}], "answer": "C", "explanation": "Ішкі қайшылықтар тұлғаның қажеттіліктері, мүмкіндіктері және қол жеткізген даму деңгейі арасындағы сәйкессіздіктерден туындайды. Мұндай қайшылықтар адамның белсенділігі мен әрі қарай дамуына ішкі қозғаушы күш бола алады."}, {"n": 15, "q": "Педагогикалық үдерістің оқу және оқудан тыс формасының бірлігі арқылы жеке тұлғаны қалыптастырудың шарты", "options": [{"key": "A", "text": "қосымша білім беру мекемелерінің қызметі"}, {"key": "B", "text": "пәнаралық байланыс"}, {"key": "C", "text": "мектептен тыс білім алу"}, {"key": "D", "text": "педагогикалық консилиум"}, {"key": "E", "text": "оқшаулап білім беру"}], "answer": "B", "explanation": "Пәнаралық байланыс білім мазмұнының тұтастығын қамтамасыз етіп, әртүрлі пәндер мен оқу және оқудан тыс әрекеттер арасындағы байланысты күшейтеді. Бұл тұлғаның дүниені біртұтас жүйе ретінде түсінуіне жағдай жасайды."}, {"n": 16, "q": "Педагогикалық үдерістің негізгі белгісі (белгілері)", "options": [{"key": "A", "text": "әлеуметтік емес"}, {"key": "B", "text": "басқару объектісі оқушылардың іс-әрекеті"}, {"key": "C", "text": "дискретті"}, {"key": "D", "text": "бір деңгейлік әлеуметтік жүйе"}, {"key": "E", "text": "үздіксіз"}], "answer": "E", "explanation": "Педагогикалық үдеріс үздіксіз сипатта болады: оқыту, тәрбие және даму бір-бірімен сабақтасып, жүйелі түрде жалғасады. Нәтижелілік жекелеген ықпалдарға емес, олардың тұрақты әрі жүйелі ұйымдастырылуына тәуелді."}, {"n": 17, "q": "«Тәрбиенің мақсаты - заттардың табиғатын зерттеу емес, өз-өзінді тану, маңызды құлықтылықты жетілдіру» тұжырымының авторы", "options": [{"key": "A", "text": "Сократ"}, {"key": "B", "text": "Я.А. Коменский"}, {"key": "C", "text": "Аристотель"}, {"key": "D", "text": "Д. Локк"}, {"key": "E", "text": "И. Гербарт"}], "answer": "A", "explanation": "Сократ тәрбиенің өзегін адамның өзін-өзі тануы және адамгершілік тұрғыдан жетілуімен байланыстырды. Оның ұстанымында адамға сыртқы дүниені ғана емес, ең алдымен өзін тану маңызды."}, {"n": 18, "q": "Tәрбиенің əлеуметтік үдеріс ретіндегі мәні", "options": [{"key": "A", "text": "жеке адамды өзгеріске жетелеуші қоғамдық іс-əрекеттердің арнайы түрі"}, {"key": "B", "text": "тəрбиелік іс-əрекеттердіә ұйымдастырыдуы"}, {"key": "C", "text": "кері байланысқа негізделуі"}, {"key": "D", "text": "нақты мақсатқа бағытталуы"}, {"key": "E", "text": "қоғамның экономикалық жағдайына тәуелділігі"}], "answer": "A", "explanation": "Тәрбие әлеуметтік үдеріс ретінде қоғамның мақсатты ықпалы арқылы тұлғаның әлеуметтік тәжірибені меңгеруіне және өзгеруіне жағдай жасайды. Сондықтан ол жеке адамды дамытуға бағытталған арнайы қоғамдық іс-әрекет ретінде сипатталады."}, {"n": 19, "q": "Aқиқатты дүниеге және ондағы адамның алар орнына, оны қоршаған болмысына және өз-өзіне қатынасына деген көзқарастар жүйесі", "options": [{"key": "A", "text": "өмірлік тәжірибе"}, {"key": "B", "text": "сенімдер"}, {"key": "C", "text": "білім жүйесі"}, {"key": "D", "text": "дүниетаным"}, {"key": "E", "text": "ортаға деген қатынас"}], "answer": "D", "explanation": "Дүниетаным – адамның дүние, қоғам, табиғат, өзінің сол дүниедегі орны және қоршаған болмысқа қатынасы туралы жалпыланған көзқарастар жүйесі. Ол білім, сенім, құндылық және ұстанымдарды біріктіреді."}, {"n": 20, "q": "Aдамның іс-əрекетімен, қоғамдық жəне еңбектік қатынастарға келуімен байланысты тәрбие принципі", "options": [{"key": "A", "text": "өнеге-үлгіні сүйеніш ету"}, {"key": "B", "text": "қоғамға бағытттылық"}, {"key": "C", "text": "тəрбиелік ықпалдар бірлігі"}, {"key": "D", "text": "өмір жəне еңбекпен байланыстық"}, {"key": "E", "text": "тұлғаға бағыттылық"}], "answer": "D", "explanation": "Өмір және еңбекпен байланыс принципі тәрбиені нақты қоғамдық тәжірибемен, пайдалы іс-әрекетпен және еңбек қатынастарымен ұштастыруды талап етеді. Осы арқылы тұлға әлеуметтік тәжірибені іс жүзінде меңгереді."}, {"n": 21, "q": "Təрбие мақсаты мен міндеттерінің, мазмұн, форма жəне əдістерінің бірлігі ретіндегі тәрбие үдерісінің ерекшелігі", "options": [{"key": "A", "text": "үздіксіздігі"}, {"key": "B", "text": "нəтиже ұзақтығы"}, {"key": "C", "text": "мақсаттар бірлігі"}, {"key": "D", "text": "мақсатты бағыттылық"}, {"key": "E", "text": "кешенділігі"}], "answer": "E", "explanation": "Тәрбие үдерісінің кешенділігі мақсаттар мен міндеттердің, мазмұнның, формалар мен әдістердің өзара бірлігін білдіреді. Тұлға қасиеттері өзара байланыста қалыптасатындықтан, тәрбиелік ықпал да тұтас жүйе ретінде ұйымдастырылады."}, {"n": 22, "q": "Tәрбие әдістері топтастырылады", "options": [{"key": "A", "text": "іс-әрекет пен мінез-құлықты ынталандыру әдістері"}, {"key": "B", "text": "мадақтау әдістері"}, {"key": "C", "text": "танымдық іс-әрекетті ынталандыру әдістері"}, {"key": "D", "text": "практикалық іскерліктерді қалыптастыру әдістері"}, {"key": "E", "text": "жазалау әдістері"}], "answer": "A", "explanation": "Тәрбие әдістерінің негізгі топтарының бірі – іс-әрекет пен мінез-құлықты ынталандыру әдістері. Бұл топ тәрбиеленушінің жағымды әрекетін қолдап, мінез-құлқын реттеуге ықпал ететін тәсілдерді қамтиды."}, {"n": 23, "q": "Жас деңгейлеріне және отбасы мүшелерінің санына байланысты отбасыларының бөліну белгісі", "options": [{"key": "A", "text": "бала саны"}, {"key": "B", "text": "тұрмыстық жағдайы"}, {"key": "C", "text": "даму жағдайы"}, {"key": "D", "text": "құрылымы"}, {"key": "E", "text": "қатынас түрі"}], "answer": "D", "explanation": "Отбасының құрылымы оның құрамымен, мүшелерінің саны және жас ерекшеліктерімен сипатталады. Сондықтан отбасы мүшелерінің саны мен жас деңгейіне қарай жіктеу құрылымдық белгіге жатады."}, {"n": 24, "q": "«Оқыту мен даму бір-біріне тәуелсіз екі түрлі үдеріс» идеясын дамытқан", "options": [{"key": "A", "text": "Л.В.Занков"}, {"key": "B", "text": "П.Я.Гальперин"}, {"key": "C", "text": "Л.С.Выготский"}, {"key": "D", "text": "Б.Г.Ананьев"}, {"key": "E", "text": "Д.Б.Эльконин"}], "answer": "C", "explanation": "Берілген тұжырым Л.С. Выготский талдаған оқыту мен дамудың арақатынасы жөніндегі тәсілдердің бірі ретінде беріледі. Выготский бұл көзқарасты талдап қана қоймай, өзінің мәдени-тарихи тұжырымдамасында оқытудың дамуды алға жетелеуі мүмкін екенін негіздеді."}, {"n": 25, "q": "Бейіндік оқыту", "options": [{"key": "A", "text": "жоғары сыныптағылардың ҰБТ-ға даярлығын қамтамасыз ету"}, {"key": "B", "text": "музыкалық білім беру бағдарламаларын игеруге дайындау"}, {"key": "C", "text": "мектептегі технология пәніне ерекше жағдай жасау"}, {"key": "D", "text": "жоғары білім алу мүмкіндігі төмен балаларды кәсіпке оқыту"}, {"key": "E", "text": "білім алушылардың арнаулы бейімділігі мен қызығушылығын, қабілетін ескеруге бағытталған білім беру"}], "answer": "E", "explanation": "Бейіндік оқыту білім алушының жеке қызығушылығы, қабілеті және кәсіби бағдарын ескеріп, оқу мазмұнын саралауға бағытталады. Оның мақсаты оқушының бейімділігіне сәйкес білім алу траекториясын құру."}, {"n": 26, "q": "Дәстүрлі сабақтың құрылымы", "options": [{"key": "A", "text": "ұйымдастыру, үй тапсырмасын сұрау, жаңа сабақ түсіндіру, бағалау"}, {"key": "B", "text": "ұйымдастыру, топтарға бөлу, рефлексия"}, {"key": "C", "text": "сипаттау, ойландыру, пікірсайыс"}, {"key": "D", "text": "білімдік, тәрбиелік, дамытушылық"}, {"key": "E", "text": "мақсатты айқындау, оқушылардың белсендігі, кері байланыс"}], "answer": "A", "explanation": "Дәстүрлі сабақ құрылымында ұйымдастыру кезеңі, үй тапсырмасын тексеру, жаңа материалды түсіндіру және оқу нәтижесін бағалау сияқты бірізді кезеңдер болады. Бұл сабақтың классикалық ұйымдастырылу логикасын көрсетеді."}, {"n": 27, "q": "Барлық үйренушілерге бірлескен таным үдерісіне белсенді араласуға мүмкіндік беретін әдіс", "options": [{"key": "A", "text": "белсенді"}, {"key": "B", "text": "интербелсенді"}, {"key": "C", "text": "жұптық"}, {"key": "D", "text": "дәстүрлі"}, {"key": "E", "text": "топтық"}], "answer": "B", "explanation": "Интербелсенді әдістер білім алушылардың өзара әрекетіне, пікір алмасуына және бірлескен танымдық жұмысқа негізделеді. Сондықтан олар барлық қатысушыларды оқу үдерісіне белсенді араластыруға мүмкіндік береді."}, {"n": 28, "q": "Білім, ептілік жəне дағдылардың игерілу процесіне бақылау", "options": [{"key": "A", "text": "анықтау"}, {"key": "B", "text": "қадағалау"}, {"key": "C", "text": "тексеру"}, {"key": "D", "text": "салыстыру"}, {"key": "E", "text": "бағалау"}], "answer": "B", "explanation": "Қадағалау – білім, ептілік және дағдылардың игерілу барысын жүйелі бақылауға бағытталған әрекет. Ол оқу үдерісінің қалай жүріп жатқанын тұрақты бақылап, кейінгі тексеру мен бағалауға ақпарат береді."}, {"n": 29, "q": "Oқушылардың танымдық іс-әрекетіндегі бақылаудың түрлері", "options": [{"key": "A", "text": "Аралық бақылау"}, {"key": "B", "text": "Кезең бойынша бақылау"}, {"key": "C", "text": "Ағымдық бақылау"}, {"key": "D", "text": "Кіріспе бақылау"}, {"key": "E", "text": "Тақырыптық бақылау"}], "answer": "E", "explanation": "Тақырыптық бақылау белгілі бір тақырып немесе мазмұндық бөлім аяқталғаннан кейін сол материалдың меңгерілу деңгейін анықтайды. Ол оқушының нақты тақырып бойынша білімінің жүйелілігі мен толықтығын бағалауға мүмкіндік береді."}, {"n": 30, "q": "Дидактикада оқу технологиялардың ғылыми жəне діни, гуманистік жəне əміршіл- əкімшіл (авторитарлы) түрлеріне бөліну деңгейі", "options": [{"key": "A", "text": "дəстүрлі оқу жүйесін жаңалау"}, {"key": "B", "text": "қолдану"}, {"key": "C", "text": "тəжірибе меңгерудің тұжырымы"}, {"key": "D", "text": "философиялық"}, {"key": "E", "text": "тұлғалық құрылымға бағдарлану"}], "answer": "D", "explanation": "Оқу технологияларын ғылыми немесе діни, гуманистік немесе авторитарлық деп жіктеу олардың негізінде жатқан дүниетанымдық және құндылықтық бағдарға қатысты. Сондықтан мұндай жіктеу философиялық деңгейге жатады."}];let mode='quiz',a={};const $=s=>document.querySelector(s);
function render(){let h='';D.forEach(x=>{h+=`<section class="card" id="q${x.n}"><div class="num">СҰРАҚ ${String(x.n).padStart(2,'0')} / 30</div><div class="q">${x.q}</div><div class="opts">${x.options.map(o=>`<button class="opt" data-k="${o.key}"><span class="ltr">${o.key}</span><span>${o.text}</span></button>`).join('')}</div><div class="fb"></div></section>`});$('#questions').innerHTML=h;D.forEach(x=>{let c=$('#q'+x.n);c.querySelectorAll('.opt').forEach(b=>b.onclick=()=>choose(x,c,b.dataset.k))});update()}
function choose(x,c,k){if(mode==='quiz'&&a[x.n])return;a[x.n]=k;c.querySelectorAll('.opt').forEach(b=>b.classList.toggle('selected',b.dataset.k===k));if(mode==='quiz')reveal(x,c,k);update();if(mode==='quiz'&&Object.keys(a).length===30)finish(false)}
function reveal(x,c,k){let f=c.querySelector('.fb');c.querySelectorAll('.opt').forEach(b=>{b.disabled=true;if(b.dataset.k===x.answer)b.classList.add('correct');if(b.dataset.k===k&&k!==x.answer)b.classList.add('wrong')});let ok=k===x.answer;f.className='fb show '+(ok?'good':'bad');f.innerHTML=`<b>${ok?'ДҰРЫС ✓':'ҚАТЕ ×'} · Дұрыс жауап: ${x.answer}</b>${x.explanation}`}
function update(){let n=Object.keys(a).length;$('#count').textContent=n+' / 30';$('#bar').style.width=n/30*100+'%';const btn=$('#show');btn.classList.toggle('show',mode==='test');btn.disabled=n!==30;btn.textContent=n===30?'НӘТИЖЕНІ КӨРУ →':`НӘТИЖЕНІ КӨРУ (${n}/30)`}
function finish(all=true){let s=0;D.forEach(x=>{if(a[x.n]===x.answer)s++;if(all)reveal(x,$('#q'+x.n),a[x.n])});$('#score').textContent=s+' / 30';$('#desc').textContent=`Дұрыс жауап: ${s}. Қате жауап: ${30-s}.`;$('#result').classList.add('show');$('#result').scrollIntoView({behavior:'smooth'})}
$('#show').onclick=()=>{if(Object.keys(a).length===30)finish(true)};document.querySelectorAll('.mode').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;document.querySelectorAll('.mode').forEach(z=>z.classList.toggle('active',z===b));$('#label').textContent=mode==='quiz'?'КВИЗ РЕЖИМІ':'ТЕСТ РЕЖИМІ';a={};$('#result').classList.remove('show');render()});$('#reset').onclick=()=>{a={};$('#result').classList.remove('show');render();scrollTo({top:0,behavior:'smooth'})};render();</script></body></html>
